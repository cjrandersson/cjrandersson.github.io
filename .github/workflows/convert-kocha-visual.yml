name: Convert Kocha visual

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/convert-kocha-visual.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Convert JPEG to PNG and rename
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path('media/ghee/9BE2AD7F-B014-4F82-AEE4-37BE1F9FC551.jpeg')
          dst = Path('media/ghee/kocha-visual-language.png')

          with Image.open(src) as image:
              if image.mode not in ('RGB', 'RGBA'):
                  image = image.convert('RGB')
              image.save(dst, format='PNG', optimize=True)

          src.unlink()
          Path('.github/workflows/convert-kocha-visual.yml').unlink()
          PY

      - name: Commit converted file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Convert Kocha visual to PNG and rename"
          git push

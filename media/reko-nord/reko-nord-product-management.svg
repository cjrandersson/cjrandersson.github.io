<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="REKO Nord weekly product management">
  <style>
    .logo{font:700 26px Arimo,Arial,sans-serif;letter-spacing:2px;fill:#1D251F}
    .display{font:500 70px Newsreader,Georgia,serif;fill:#1D251F}
    .h1{font:500 46px Newsreader,Georgia,serif;fill:#1D251F}
    .h2{font:500 30px Newsreader,Georgia,serif;fill:#1D251F}
    .body{font:400 20px Arimo,Arial,sans-serif;fill:#1D251F}
    .small{font:600 16px Arimo,Arial,sans-serif;fill:#1D251F}
    .micro{font:500 13px Arimo,Arial,sans-serif;fill:#6F766F;letter-spacing:.4px}
    .nav{font:600 17px Arimo,Arial,sans-serif;fill:#BFD0C4}
    .nav.active{fill:#FFF}
    .light{fill:#FFF}
    .muted{fill:#6F766F}
    .price{font:700 21px Arimo,Arial,sans-serif;fill:#183E32}
    .status{font:700 13px Arimo,Arial,sans-serif;letter-spacing:.4px}
  </style>
  <rect width="1600" height="1000" fill="#DAD2C4"/>
  <rect x="35" y="35" width="1530" height="930" rx="34" fill="#F4EFE5"/>
  <circle cx="82" cy="72" r="7" fill="#B6AA9B"/><circle cx="106" cy="72" r="7" fill="#B6AA9B"/><circle cx="130" cy="72" r="7" fill="#B6AA9B"/>
  <rect x="70" y="110" width="250" height="820" rx="22" fill="#183E32"/>
       <text x="110" y="170" class="logo light">REKO.NORD</text>
       <text x="110" y="245" class="nav active">Översikt</text>
       <text x="110" y="300" class="nav">Beställningar</text>
       <text x="110" y="355" class="nav">Veckans utbud</text>
       <text x="110" y="410" class="nav">Utlämning</text>
       <text x="110" y="465" class="nav">Gårdsprofil</text>
       <circle cx="120" cy="855" r="24" fill="#9FB09A"/>
       <text x="158" y="862" class="small light">Ekbolanda Gård</text>
  <g transform="translate(370 145)">
    <text x="0" y="35" class="micro">VECKANS UTBUD</text>
    <text x="0" y="95" class="h1">Odla en gång. Publicera enkelt.</text>
    <text x="0" y="135" class="body muted">Återanvänd produkter, justera lagret och öppna veckans försäljning.</text>
    <rect x="965" y="40" width="210" height="60" rx="30" fill="#183E32"/><text x="1070" y="77" text-anchor="middle" class="small light">+ Ny produkt</text>
    <rect x="0" y="185" width="1175" height="610" rx="26" fill="#FFFCF6" stroke="#D9D2C5"/>
    <text x="35" y="235" class="micro">PRODUKT</text><text x="650" y="235" class="micro">LAGER</text><text x="820" y="235" class="micro">PRIS</text><text x="1000" y="235" class="micro">PUBLICERAD</text>
    <line x1="35" y1="260" x2="1140" y2="260" stroke="#D9D2C5"/>
    <g transform="translate(35 285)">
      <circle cx="40" cy="40" r="40" fill="#D46A3C"/><text x="105" y="35" class="h2">Ekologiska morötter</text><text x="105" y="65" class="small muted">1 kg · Grönsaker</text>
      <rect x="590" y="16" width="120" height="48" rx="24" fill="#F4EFE5"/><text x="650" y="46" text-anchor="middle" class="small">−  32  +</text><text x="785" y="50" class="price">45 kr</text>
      <rect x="965" y="20" width="62" height="34" rx="17" fill="#183E32"/><circle cx="1010" cy="37" r="13" fill="#FFF"/>
    </g>
    <line x1="35" y1="390" x2="1140" y2="390" stroke="#D9D2C5"/>
    <g transform="translate(35 415)">
      <ellipse cx="40" cy="40" rx="30" ry="40" fill="#D8C28C"/><text x="105" y="35" class="h2">Gårdsägg</text><text x="105" y="65" class="small muted">12-pack · Ägg</text>
      <rect x="590" y="16" width="120" height="48" rx="24" fill="#F4EFE5"/><text x="650" y="46" text-anchor="middle" class="small">−  18  +</text><text x="785" y="50" class="price">68 kr</text>
      <rect x="965" y="20" width="62" height="34" rx="17" fill="#183E32"/><circle cx="1010" cy="37" r="13" fill="#FFF"/>
    </g>
    <line x1="35" y1="520" x2="1140" y2="520" stroke="#D9D2C5"/>
    <g transform="translate(35 545)">
      <rect x="5" y="5" width="70" height="70" rx="14" fill="#DBA93B"/><text x="105" y="35" class="h2">Sommarhonung</text><text x="105" y="65" class="small muted">500 g · Honung</text>
      <rect x="590" y="16" width="120" height="48" rx="24" fill="#F4EFE5"/><text x="650" y="46" text-anchor="middle" class="small">−  9  +</text><text x="785" y="50" class="price">95 kr</text>
      <rect x="965" y="20" width="62" height="34" rx="17" fill="#D8D8D1"/><circle cx="982" cy="37" r="13" fill="#FFF"/>
    </g>
    <rect x="795" y="710" width="345" height="58" rx="29" fill="#183E32"/><text x="968" y="746" text-anchor="middle" class="small light">Publicera veckans utbud</text>
  </g>
  </svg>
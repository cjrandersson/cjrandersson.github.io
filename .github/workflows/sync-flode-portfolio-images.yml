name: Sync flöde portfolio PNGs

on:
  push:
    paths:
      - '.github/workflows/sync-flode-portfolio-images.yml'

permissions:
  contents: write

jobs:
  sync-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Copy original flöde PNG references into the portfolio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media/flode

          curl -fL --retry 3 --retry-delay 2 \
            -o media/flode/flode-interface-light-six-pod.png \
            'https://raw.githubusercontent.com/cjrandersson/flode-mvp/codex/flode-complete-handoff/design/references/04-wide-16x9-interface.png'

          curl -fL --retry 3 --retry-delay 2 \
            -o media/flode/flode-interface-dark-six-pod.png \
            'https://raw.githubusercontent.com/cjrandersson/flode-mvp/codex/flode-complete-handoff/design/references/07-dark-orange-controls.png'

          curl -fL --retry 3 --retry-delay 2 \
            -o media/flode/flode-interface-jungulator-detail.png \
            'https://raw.githubusercontent.com/cjrandersson/flode-mvp/codex/flode-complete-handoff/design/references/08-jungulator-sampler-dark.png'

          python3 - <<'PY'
          from pathlib import Path
          import struct

          paths = [
              Path('media/flode/flode-interface-light-six-pod.png'),
              Path('media/flode/flode-interface-dark-six-pod.png'),
              Path('media/flode/flode-interface-jungulator-detail.png'),
          ]
          signature = b'\x89PNG\r\n\x1a\n'
          for path in paths:
              data = path.read_bytes()
              if not data.startswith(signature):
                  raise SystemExit(f'{path} is not a valid PNG')
              width, height = struct.unpack('>II', data[16:24])
              print(f'{path}: {width}x{height}, {len(data)} bytes')
          PY

      - name: Commit PNG assets and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/flode/flode-interface-light-six-pod.png \
                  media/flode/flode-interface-dark-six-pod.png \
                  media/flode/flode-interface-jungulator-detail.png
          git rm .github/workflows/sync-flode-portfolio-images.yml
          git commit -m 'Add high-quality flöde interface PNGs'
          git push

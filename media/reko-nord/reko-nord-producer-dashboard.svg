<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="REKO Nord producer dashboard">
  <style>
    .logo{font:700 26px Arimo,Arial,sans-serif;letter-spacing:2px;fill:#1D251F}
    .display{font:500 70px Newsreader,Georgia,serif;fill:#1D251F}
    .h1{font:500 46px Newsreader,Georgia,serif;fill:#1D251F}
    .h2{font:500 30px Newsreader,Georgia,serif;fill:#1D251F}
    .body{font:400 20px Arimo,Arial,sans-serif;fill:#1D251F}
    .small{font:600 16px Arimo,Arial,sans-serif;fill:#1D251F}
    .micro{font:500 13px Arimo,Arial,sans-serif;fill:#6F766F;letter-spacing:.4px}
    .nav{font:600 17px Arimo,Arial,sans-serif;fill:#BFD0C4}
    .nav.active{fill:#FFF}
    .light{fill:#FFF}
    .muted{fill:#6F766F}
    .price{font:700 21px Arimo,Arial,sans-serif;fill:#183E32}
    .status{font:700 13px Arimo,Arial,sans-serif;letter-spacing:.4px}
  </style>
  <rect width="1600" height="1000" fill="#DAD2C4"/>
  <rect x="35" y="35" width="1530" height="930" rx="34" fill="#F4EFE5"/>
  <circle cx="82" cy="72" r="7" fill="#B6AA9B"/><circle cx="106" cy="72" r="7" fill="#B6AA9B"/><circle cx="130" cy="72" r="7" fill="#B6AA9B"/>
  <rect x="70" y="110" width="250" height="820" rx="22" fill="#183E32"/>
       <text x="110" y="170" class="logo light">REKO.NORD</text>
       <text x="110" y="245" class="nav active">Översikt</text>
       <text x="110" y="300" class="nav">Beställningar</text>
       <text x="110" y="355" class="nav">Veckans utbud</text>
       <text x="110" y="410" class="nav">Utlämning</text>
       <text x="110" y="465" class="nav">Gårdsprofil</text>
       <circle cx="120" cy="855" r="24" fill="#9FB09A"/>
       <text x="158" y="862" class="small light">Ekbolanda Gård</text>
  <g transform="translate(370 145)">
    <text x="0" y="35" class="micro">PRODUCENTPORTAL</text>
    <text x="0" y="95" class="h1">God morgon, Ekbolanda.</text>
    <text x="0" y="135" class="body muted">Det viktigaste inför nästa utlämning — inget mer.</text>
    <rect x="0" y="185" width="760" height="145" rx="24" fill="#9FB09A"/>
    <text x="35" y="225" class="micro">NÄSTA UTLÄMNING</text>
    <text x="35" y="272" class="h2">Torsdag, 20 augusti</text>
    <text x="35" y="305" class="small">Vaksala torg · 17:30–19:00</text>
    <rect x="585" y="228" width="140" height="56" rx="28" fill="#183E32"/><text x="655" y="263" text-anchor="middle" class="small light">Förbered</text>
    <g transform="translate(0 365)">
      <rect width="235" height="150" rx="22" fill="#FFFCF6" stroke="#D9D2C5"/><text x="25" y="42" class="micro">BESTÄLLNINGAR</text><text x="25" y="100" class="h1">24</text><text x="25" y="130" class="small muted">+6 sedan igår</text>
      <rect x="255" width="235" height="150" rx="22" fill="#FFFCF6" stroke="#D9D2C5"/><text x="280" y="42" class="micro">ORDERVÄRDE</text><text x="280" y="100" class="h1">8 420</text><text x="280" y="130" class="small muted">SEK denna vecka</text>
      <rect x="510" width="250" height="150" rx="22" fill="#FFFCF6" stroke="#D9D2C5"/><text x="535" y="42" class="micro">ÅTGÄRD KRÄVS</text><text x="535" y="100" class="h1">2</text><text x="535" y="130" class="small muted">betalningar</text>
    </g>
    <rect x="800" y="185" width="330" height="480" rx="24" fill="#FFFCF6" stroke="#D9D2C5"/>
    <text x="835" y="230" class="h2">Att göra</text>
    <circle cx="850" cy="285" r="15" fill="#D7E3D8"/><path d="M842 285l6 6 11-14" fill="none" stroke="#183E32" stroke-width="3"/>
    <text x="880" y="291" class="small">Publicera veckans utbud</text>
    <line x1="835" y1="325" x2="1095" y2="325" stroke="#D9D2C5"/>
    <circle cx="850" cy="370" r="15" fill="#F1D1BF"/><text x="850" y="375" text-anchor="middle" class="small" fill="#D46A3C">!</text>
    <text x="880" y="365" class="small">Kontakta två kunder</text><text x="880" y="390" class="micro">Väntar betalning</text>
    <line x1="835" y1="425" x2="1095" y2="425" stroke="#D9D2C5"/>
    <circle cx="850" cy="470" r="15" fill="#D7E3D8"/><path d="M842 470l6 6 11-14" fill="none" stroke="#183E32" stroke-width="3"/>
    <text x="880" y="477" class="small">Skriv ut plocklista</text>
  </g>
  </svg>
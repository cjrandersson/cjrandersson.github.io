<head>

  <title>CJ Robin Andersson — Selected Work</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" />
  <link rel="stylesheet" href="styles.css" />

</head>
<body>
  <a class="skip" href="#work">Skip to work</a>
  <header class="site-header">
    <div class="header-profile">
      <a class="identity" href="#work" aria-label="robin andersson, back to work">
        <strong>robin andersson</strong>
      </a>
      <section id="about" class="header-about" aria-labelledby="header-about-title">
        <h2 id="header-about-title">Visual work across graphic systems, images and imagined spaces. Visual work that refuses to stay in its lane.</h2>
      </section>
    </div>
    <nav aria-label="Primary navigation">
      <a href="#work">Work</a><a href="#about">About</a><a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="work" class="work" aria-labelledby="work-title">
      <div class="gallery-bar">
        <h1 id="work-title">/selected works</h1>
        <p id="count" aria-live="polite"></p>
      </div>
      <div id="gallery" class="gallery"></div>
    </section>

  </main>

  <footer id="contact">
    <div><a href="https://cara.app/cjrobin1" target="_blank" rel="noreferrer">Cara ↗</a><a href="https://www.artstation.com/cjrobinandersson" target="_blank" rel="noreferrer">ArtStation ↗</a><a href="mailto:hello@example.com">Email</a></div>
    <p>© <span id="year"></span></p>
  </footer>

  <dialog id="viewer" class="viewer" aria-labelledby="viewer-title">
    <button class="viewer-close" aria-label="Close viewer">Close</button>
    <button class="viewer-nav viewer-prev" aria-label="Previous project">←</button>
    <figure>
      <div id="viewer-art" class="viewer-art"></div>
      <figcaption class="project-info-box">
        <div class="project-info-head"><strong id="viewer-title"></strong><small id="viewer-meta"></small></div>
        <dl class="project-info-grid">
          <div><dt>Made</dt><dd id="viewer-what"></dd></div>
          <div><dt>Why</dt><dd id="viewer-why"></dd></div>
          <div><dt>Notes</dt><dd id="viewer-thoughts"></dd></div>
          <div><dt>Applications / software</dt><dd id="viewer-software"></dd></div>
        </dl>
      </figcaption>
    </figure>
    <button class="viewer-nav viewer-next" aria-label="Next project">→</button>
  </dialog>
  <script src="projects.js?v=20260828d"></script>
  <script src="app.js?v=20260828e"></script>
</body>
